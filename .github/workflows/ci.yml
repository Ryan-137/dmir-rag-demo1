name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.0.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  backend:
    name: Backend dependency check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    env:
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      HF_ENDPOINT: https://hf-mirror.com

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install Python
        run: uv python install 3.14.4

      - name: Create virtual environment
        run: uv venv --python 3.14.4

      - name: Install backend dependencies
        run: uv pip install ${{ runner.os == 'Linux' && '--torch-backend cpu' || '' }} -r backend/requirements.txt

      - name: Compile backend
        run: .venv/bin/python -m compileall backend

      - name: Import backend service modules
        working-directory: backend
        run: |
          ../.venv/bin/python - <<'PY'
          import importlib

          modules = [
              "services.loading_service",
              "services.chunking_service",
              "services.embedding_service",
              "services.vector_store_service",
              "services.search_service",
              "services.parsing_service",
              "services.generation_service",
              "utils.config",
              "utils.model_utils",
          ]

          for module in modules:
              importlib.import_module(module)
              print(f"imported {module}")
          PY
